<svg xmlns="http://www.w3.org/2000/svg" width="720" height="120" viewBox="0 0 720 120" role="img" aria-labelledby="title">
  <title id="title">仕様、確認、スライドの順に進む</title>
  <rect width="720" height="120" fill="#f6f1ea" />
  <g fill="#121722" font-family="sans-serif" font-size="24" text-anchor="middle">
    <text x="120" y="70">仕様</text>
    <text x="360" y="70">確認</text>
