name: Publish npm package

on:
  push:
    branches: [main]
    paths: [package.json]

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  detect:
    name: Detect version increase
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      increased: ${{ steps.version.outputs.increased }}
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          run-install: false
      - name: Compare versions before and after push
        id: version
        run: node scripts/release-ci.ts detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}

  build:
    needs: detect
    if: needs.detect.outputs.increased == 'true'
    name: Test and pack package
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Check source
        run: vp check

      - name: Run tests
        run: vp test

      - name: Build CLI
        run: vp pack

      - name: Verify stable package version
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const packageJson = JSON.parse(await readFile("package.json", "utf8"));
          const stableSemver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;

          if (packageJson.name !== "create-slidev-for-agents") {
            throw new Error(`公開対象ではないpackage名です: ${packageJson.name}`);
          }

          if (typeof packageJson.version !== "string" || !stableSemver.test(packageJson.version)) {
            throw new Error(`安定版ではないversionは公開できません: ${packageJson.version}`);
          }

          console.log(`Package: ${packageJson.name}@${packageJson.version}`);
          NODE

      - name: Create package directory
        run: mkdir package

      - name: Create package tarball
        run: vp pm pack --pack-destination package

      - name: Verify generated tarball
        run: |
          node --input-type=module <<'NODE'
          import { readdir } from "node:fs/promises";

          const entries = await readdir("package");
          const tarballs = entries.filter((entry) => entry.endsWith(".tgz"));

          if (tarballs.length !== 1) {
            throw new Error(`tarballは1個である必要があります。実際の個数: ${tarballs.length}`);
          }

          console.log(`Generated tarball: ${tarballs[0]}`);
          NODE

      - name: Show package contents
        run: tar --list --file package/*.tgz

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 1

  stage:
    name: Stage package on npm
    needs: build
    runs-on: ubuntu-24.04
    environment: npm

    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          run-install: false

      - name: Verify supported npm version
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";

          const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          const [major, minor] = version.split(".").map(Number);

          if (!Number.isInteger(major) || !Number.isInteger(minor) || major < 11 || (major === 11 && minor < 15)) {
            throw new Error(`npm 11.15.0以上が必要です。現在のバージョン: ${version}`);
          }

          console.log(`npm version: ${version}`);
          NODE

      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: package

      - name: Verify downloaded tarball
        run: |
          node --input-type=module <<'NODE'
          import { readdir } from "node:fs/promises";

          const entries = await readdir("package");
          const tarballs = entries.filter((entry) => entry.endsWith(".tgz"));

          if (tarballs.length !== 1) {
            throw new Error(`tarballは1個である必要があります。実際の個数: ${tarballs.length}`);
          }

          console.log(`Publishing tarball: ${tarballs[0]}`);
          NODE

      - name: Show package contents again
        run: tar --list --file package/*.tgz

      - name: Stage package on npm
        run: npm stage publish ./package/*.tgz --access public
